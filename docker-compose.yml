# DESTEKLENMIYOR
# Bu dosya bu kaynak sürümünde kurulum yolu değildir.
# Compose PostgreSQL ister; uygulamanın doğrulanmış şeması SQL Server'dır.
# Parolalar yalnızca yerel yer tutucudur. Çalıştırmayın.
version: "3.8"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://notbak:notbak@db:5432/notbak
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config:/app/config

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notbak
      POSTGRES_PASSWORD: notbak
      POSTGRES_DB: notbak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notbak"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
